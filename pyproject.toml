[project]
name = "agentice-memory"
version = "0.1.0"
description = "Memento + memlayer — a from-scratch Mem0-style memory library and CLI assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "google-genai>=0.3",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=3.0",
]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
mcp = [
    "mcp>=1.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.scripts]
memento = "memento.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memlayer", "memento", "server", "mcp_server"]

[tool.pytest.ini_options]
markers = [
    "live: hits the real Gemini API (requires GEMINI_API_KEY, skipped by default)",
]
addopts = "-m 'not live'"
testpaths = ["tests"]

[tool.coverage.run]
source = ["memlayer", "memento", "server", "mcp_server"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection idiom requires calling Depends() in a
# parameter default — this is the correct pattern, not the bug B008 flags.
"server/app.py" = ["B008"]
